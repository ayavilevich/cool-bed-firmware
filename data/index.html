<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cool Bed</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🛏️</text></svg>" />
</head>
<body x-data="coolBedApp()">

	<header>
		<h1>🛏️ Cool Bed</h1>
		<nav><a href="/config.html">⚙️ Configuration</a></nav>
	</header>

	<main>
		<section class="card connection-state" x-show="!isStateFresh()" x-cloak>
			<h2 x-text="stateStatusTitle()"></h2>
			<!--<p x-text="stateStatusMessage()"></p>-->
			<div class="loading-indicator" aria-label="Loading">
				<span class="spinner" aria-hidden="true"></span>
				<span x-text="stateStatusMessage()"></span>
			</div>
		</section>

		<div x-show="isStateFresh()" x-cloak>
		<!-- Mode Controls -->
		<section class="card mode-controls">
			<h2>Mode</h2>

			<!--<div class="mode-buttons">
				<button class="btn btn-primary" x-show="state.mode !== 'temperature'" @click="startTemperature()">▶ Start Temperature Goal Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'speed'" @click="startSpeed()">▶ Start Fixed Speed Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'flow_test'" @click="startFlowTest()">▶ Start Flow Test Mode</button>
				<button class="btn btn-danger" x-show="state.mode !== 'stop'" @click="setMode('stop')">⏹ Stop</button>
			</div>-->

			<!-- Main telemetry-->
			<div class="telemetry-grid">
				<div class="metric wide">
					<span class="icon">📟</span>
					<span class="label">Status</span>
					<span class="value" x-text="state.status || '—'"></span>
				</div>
				<div class="metric">
					<span class="icon">🔄</span>
					<span class="label">Mode</span>
					<span class="value" x-text="state.mode || '—'"></span>
				</div>
				<div class="metric" :class="{ 'error': state.error }">
					<span class="icon">🚨</span>
					<span class="label">Error</span>
					<span class="value" x-text="state.error ? 'YES' : 'No'"></span>
				</div>
			</div>

			<!-- Temperature mode -->
			<div class="mode-panel">
				<label x-text="labelFor('temperatureSetPoint', 'Temperature Mode')"></label>
				<input type="range" :min="minFor('temperatureSetPoint')" :max="maxFor('temperatureSetPoint')" step="0.5" :value="temperatureSetPointDisplay" @input="onTemperatureSetPointInput($event.target.value)" @change="onTemperatureSetPointChanged()">
				<span x-text="formatTemperatureSetPointDisplay()"></span>
				<button class="btn btn-primary" x-show="state.mode !== 'temperature'" @click="startTemperature()">▶ Start Temperature Goal Mode</button>
				<button class="btn btn-danger" x-show="state.mode === 'temperature'" @click="setMode('stop')">⏹ Stop Temperature Goal Mode</button>
			</div>

			<!-- Speed mode -->
			<div class="mode-panel">
				<label x-text="labelFor('circSpeedSetPoint', 'Manual Circulation Mode')"></label>
				<input type="range" :min="minFor('circSpeedSetPoint')" :max="maxFor('circSpeedSetPoint')" x-model.number="state.circSpeedSetPoint" @change="onCircSpeedSetPointChanged()">
				<span x-text="state.circSpeedSetPoint"></span>
				<button class="btn btn-primary" x-show="state.mode !== 'manual_circ'" @click="startManualCirc()">▶ Start Manual Circulation Mode</button>
				<button class="btn btn-danger" x-show="state.mode === 'manual_circ'" @click="setMode('stop')">⏹ Stop Manual Circulation Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'manual_cool'" @click="startManualCool()">▶ Start Manual Cooling Mode</button>
				<button class="btn btn-danger" x-show="state.mode === 'manual_cool'" @click="setMode('stop')">⏹ Stop Manual Cooling Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'manual_heat'" @click="startManualHeat()">▶ Start Manual Heating Mode</button>
				<button class="btn btn-danger" x-show="state.mode === 'manual_heat'" @click="setMode('stop')">⏹ Stop Manual Heating Mode</button>
			</div>

			<!-- Calibration mode -->
			<div class="mode-panel">
				<label>Calibration Mode</label>
				<div class="inline-field">
					<label x-text="labelFor('calibrationVolume', 'Calibration Volume') + (unitsFor('calibrationVolume') ? ' (' + unitsFor('calibrationVolume') + ')' : '') + ':'"></label>
					<input type="number" :min="minFor('calibrationVolume')" :max="maxFor('calibrationVolume')" x-model.number="state.calibrationVolume" @change="onCalibrationVolumeChanged()">
				</div>
				<button class="btn btn-warning" x-show="state.mode !== 'flow_calibration'" @click="startFlowCalibration()">▶ Start Flow Calibration</button>
				<button class="btn btn-danger" x-show="state.mode === 'flow_calibration'" @click="setMode('stop')">⏹ Stop Flow Calibration</button>
				<button class="btn btn-primary" x-show="state.mode !== 'flow_test'" @click="startFlowTest()">▶ Start Flow Test Mode</button>
				<button class="btn btn-danger" x-show="state.mode === 'flow_test'" @click="setMode('stop')">⏹ Stop Flow Test Mode</button>
			</div>
		</section>

		<!-- Status & Telemetry -->
		<section class="card telemetry">
			<h2>Status</h2>
			<div class="telemetry-grid">
				<div class="metric">
					<span class="icon">⚡</span>
					<span class="label">Circulation Speed</span>
					<span class="value" x-text="state.circSpeed"></span>
				</div>
				<div class="metric">
					<span class="icon">💧</span>
					<span class="label">Flow</span>
					<span class="value" x-text="formatTelemetry('flow', 2)"></span>
				</div>
				<div class="metric">
					<span class="icon">🌡️</span>
					<span class="label">Out Temp</span>
					<span class="value" x-text="formatTelemetry('outTemperature', TempUnits.DECIMAL_PLACES)"></span>
				</div>
				<div class="metric">
					<span class="icon">🌡️</span>
					<span class="label">Return Temp</span>
					<span class="value" x-text="formatTelemetry('returnTemperature', TempUnits.DECIMAL_PLACES)"></span>
				</div>
				<div class="metric">
					<span class="icon">🧊</span>
					<span class="label">Cooling Temp</span>
					<span class="value" x-text="formatTelemetry('coolingTemperature', TempUnits.DECIMAL_PLACES)"></span>
				</div>
				<div class="metric">
					<span class="icon">↕️</span>
					<span class="label">Temp Delta</span>
					<span class="value" x-text="formatTelemetry('temperatureDelta', TempUnits.DECIMAL_PLACES_DELTA)"></span>
				</div>
				<div class="metric">
					<span class="icon">❄️</span>
					<span class="label">Cooling Power</span>
					<span class="value" x-text="formatTelemetry('coolingPower', 1)"></span>
				</div>
				<div class="metric">
					<span class="icon">🔌</span>
					<span class="label">Circulation Voltage</span>
					<span class="value" x-text="formatTelemetry('circVoltage', 0)"></span>
				</div>
				<div class="metric">
					<span class="icon">⚡</span>
					<span class="label">Circulation Current</span>
					<span class="value" x-text="formatTelemetry('circCurrent', 0)"></span>
				</div>
				<div class="metric">
					<span class="icon">〰️</span>
					<span class="label">Flow Pulses/s</span>
					<span class="value" x-text="state.flowPulsesFilteredPerSec || 0"></span>
				</div>
				<!--<div class="metric">
					<span class="icon">🔢</span>
					<span class="label">Raw Pulses/s</span>
					<span class="value" x-text="state.flowPulsesRawPerSec || 0"></span>
				</div>-->
			</div>
		</section>

		<!-- Chart -->
		<section class="card chart-section">
			<h2>History (last 10 min)</h2>
			<canvas x-ref="temperatureChart" height="240"></canvas>
			<canvas x-ref="flowChart" height="240"></canvas>
			<canvas x-ref="miscChart" height="240"></canvas>
		</section>
		</div>
	</main>

	<script src="/alpine.min.js" defer></script>
	<script src="/chart.min.js"></script>
	<script src="/temperature-units.js"></script>
	<script src="/app.js"></script>
</body>
</html>
