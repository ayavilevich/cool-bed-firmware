<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cool Bed</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body x-data="coolBedApp()" x-init="init()">

	<header>
		<h1>🛏️ Cool Bed</h1>
		<nav><a href="/config.html">⚙️ Configuration</a></nav>
	</header>

	<main>
		<!-- Mode Controls -->
		<section class="card mode-controls">
			<h2>Mode</h2>

			<div class="mode-buttons">
				<button class="btn btn-primary" x-show="state.mode !== 'temperature'" @click="startTemperature()">▶ Start Temperature Goal Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'speed'" @click="startSpeed()">▶ Start Fixed Speed Mode</button>
				<button class="btn btn-primary" x-show="state.mode !== 'flowtest'" @click="startFlowTest()">▶ Start Flow Test Mode</button>
				<button class="btn btn-danger" x-show="state.mode !== 'stop'" @click="setMode('stop')">⏹ Stop</button>
			</div>

			<!-- Temperature mode -->
			<div class="mode-panel">
				<label x-text="labelFor('temperatureSetPoint', 'Temperature Mode')"></label>
				<input type="range" :min="minFor('temperatureSetPoint')" :max="maxFor('temperatureSetPoint')" step="0.5" x-model.number="tempSetPoint">
				<span x-text="tempSetPoint + (unitsFor('temperatureSetPoint') ? ' ' + unitsFor('temperatureSetPoint') : '')"></span>
			</div>

			<!-- Speed mode -->
			<div class="mode-panel">
				<label x-text="labelFor('speedSetPoint', 'Speed Mode')"></label>
				<input type="range" :min="minFor('speedSetPoint')" :max="maxFor('speedSetPoint')" x-model.number="speedSetPoint">
				<span x-text="speedSetPoint"></span>
			</div>

			<!-- Calibration mode -->
			<div class="mode-panel">
				<label>Calibration Mode</label>
				<div class="inline-field">
					<label x-text="labelFor('calibrationVolume', 'Calibration Volume') + (unitsFor('calibrationVolume') ? ' (' + unitsFor('calibrationVolume') + ')' : '') + ':'"></label>
					<input type="number" :min="minFor('calibrationVolume')" :max="maxFor('calibrationVolume')" x-model.number="calibrationVolume">
				</div>
				<button class="btn btn-warning" x-show="state.mode !== 'calibration'" @click="startCalibration()">▶ Start Pump Calibration</button>
			</div>
		</section>

		<!-- Status & Telemetry -->
		<section class="card telemetry">
			<h2>Status</h2>
			<div class="telemetry-grid">
				<div class="metric wide">
					<span class="icon">📟</span>
					<span class="label">Status</span>
					<span class="value" x-text="state.status || '—'"></span>
				</div>
				<div class="metric" :class="{ 'error': state.error }">
					<span class="icon">🚨</span>
					<span class="label">Error</span>
					<span class="value" x-text="state.error ? 'YES' : 'No'"></span>
				</div>
				<div class="metric">
					<span class="icon">🔄</span>
					<span class="label">Mode</span>
					<span class="value" x-text="state.mode || '—'"></span>
				</div>
				<div class="metric">
					<span class="icon">⚡</span>
					<span class="label">Pump Speed</span>
					<span class="value" x-text="state.pumpSpeed"></span>
				</div>
				<div class="metric">
					<span class="icon">💧</span>
					<span class="label">Flow</span>
					<span class="value" x-text="formatTelemetry('flow', 2)"></span>
				</div>
				<div class="metric">
					<span class="icon">🌡️</span>
					<span class="label">Out Temp</span>
					<span class="value" x-text="formatTelemetry('outTemperature', 1)"></span>
				</div>
				<div class="metric">
					<span class="icon">🌡️</span>
					<span class="label">Return Temp</span>
					<span class="value" x-text="formatTelemetry('returnTemperature', 1)"></span>
				</div>
				<div class="metric">
					<span class="icon">↕️</span>
					<span class="label">Temp Delta</span>
					<span class="value" x-text="formatTelemetry('temperatureDelta', 2)"></span>
				</div>
				<div class="metric">
					<span class="icon">❄️</span>
					<span class="label">Cooling Power</span>
					<span class="value" x-text="formatTelemetry('coolingPower', 1)"></span>
				</div>
				<div class="metric">
					<span class="icon">🔌</span>
					<span class="label">Voltage</span>
					<span class="value" x-text="formatTelemetry('pumpVoltage', 0)"></span>
				</div>
				<div class="metric">
					<span class="icon">⚡</span>
					<span class="label">Current</span>
					<span class="value" x-text="formatTelemetry('pumpCurrent', 0)"></span>
				</div>
				<div class="metric">
					<span class="icon">〰️</span>
					<span class="label">Flow Pulses/s</span>
					<span class="value" x-text="state.flowPulsesFilteredPerSec || 0"></span>
				</div>
				<div class="metric">
					<span class="icon">🔢</span>
					<span class="label">Raw Pulses/s</span>
					<span class="value" x-text="state.flowPulsesRawPerSec || 0"></span>
				</div>
				<!--<div class="metric">
					<span class="icon">📊</span>
					<span class="label">Calib. Flow</span>
					<span class="value" x-text="(state.calibrationFlow || 0).toFixed(2) + ' L/min'"></span>
				</div>-->
			</div>
		</section>

		<!-- Chart -->
		<section class="card chart-section">
			<h2>History (last 10 min)</h2>
			<canvas id="telemetryChart" height="120"></canvas>
		</section>
	</main>

	<script src="/alpine.min.js" defer></script>
	<script src="/chart.min.js"></script>
	<script src="/app.js"></script>
</body>
</html>
