<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cool Bed — Configuration</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body x-data="configApp()" x-init="load()">

	<header>
		<h1>⚙️ Configuration</h1>
		<nav><a href="/">🏠 Main</a></nav>
	</header>

	<main>
		<section class="card config-form">
			<h2>Settings</h2>

			<template x-if="notification">
				<div class="notification" :class="notificationClass" x-text="notification"></div>
			</template>

			<form @submit.prevent="save()">

				<fieldset>
					<legend>Device</legend>
					<label>Hostname
						<input type="text" x-model="cfg.hostname" pattern="[a-zA-Z0-9_-]+" required>
					</label>
				</fieldset>

				<fieldset>
					<legend>MQTT</legend>
					<label class="checkbox-label">
						<input type="checkbox" x-model="cfg.mqtt"> Enable MQTT
					</label>
					<label>Server
						<input type="text" x-model="cfg.mqttServer">
					</label>
					<label>Port
						<input type="number" x-model.number="cfg.mqttPort" min="1" max="65535">
					</label>
					<label>Username
						<input type="text" x-model="cfg.mqttUsername">
					</label>
					<label>Password
						<input type="password" x-model="cfg.mqttPassword" placeholder="(leave blank to keep unchanged)">
					</label>
					<label>Root Topic
						<input type="text" x-model="cfg.mqttRootTopic">
					</label>
					<label class="checkbox-label">
						<input type="checkbox" x-model="cfg.mqttHADiscovery"> HA MQTT Discovery
					</label>
					<label>HA Discovery Topic
						<input type="text" x-model="cfg.mqttHADiscoveryTopic">
					</label>
				</fieldset>

				<fieldset>
					<legend>Operation</legend>
					<label>Speed Set Point (1–255)
						<input type="range" min="1" max="255" x-model.number="cfg.speedSetPoint">
						<span x-text="cfg.speedSetPoint"></span>
					</label>
					<label>Temperature Set Point (°C)
						<input type="range" min="10" max="40" step="0.5" x-model.number="cfg.temperatureSetPoint">
						<span x-text="cfg.temperatureSetPoint + ' °C'"></span>
					</label>
					<label>System Response Time (s)
						<input type="number" x-model.number="cfg.systemTime" min="0" max="600">
					</label>
					<label>Min Flow Pulses/s
						<input type="number" x-model.number="cfg.minFlowPulsesPerSec" min="1" max="1000">
					</label>
					<label>Max Current (mA)
						<input type="number" x-model.number="cfg.maxCurrent" min="1" max="1200">
					</label>
					<label>Min Voltage (mV)
						<input type="number" x-model.number="cfg.minVoltage" min="0" max="40000">
					</label>
				</fieldset>

				<fieldset>
					<legend>Calibration</legend>
					<label>Volume (ml)
						<input type="number" x-model.number="cfg.calibrationVolume" min="1" max="5000">
					</label>
					<label>Flow at Calibration End (L/min)
						<input type="number" x-model.number="cfg.calibrationFlow" min="0" max="100" step="0.01">
					</label>
					<label>Flow Pulses During Calibration
						<input type="number" x-model.number="cfg.calibrationFlowPulses" min="1" max="10000">
					</label>
				</fieldset>

				<div class="form-actions">
					<button type="submit" class="btn btn-primary">💾 Save</button>
				</div>
			</form>
		</section>
	</main>

	<script src="/alpine.min.js" defer></script>
	<script src="/config.js"></script>
</body>
</html>
