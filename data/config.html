<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cool Bed — Configuration</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body x-data="configApp()" x-init="load()">

	<header>
		<h1>⚙️ Configuration</h1>
		<nav><a href="/">🏠 Main</a></nav>
	</header>

	<main>
		<section class="card config-form">
			<h2>Settings</h2>

			<form @submit.prevent="save()">

				<fieldset>
					<legend>Device</legend>
					<label>Hostname
						<input type="text" x-model="cfg.hostname" pattern="[a-zA-Z0-9_\-]+" required>
					</label>
				</fieldset>

				<fieldset>
					<legend>MQTT</legend>
					<label class="checkbox-label">
						<input type="checkbox" x-model="cfg.mqtt"> <span x-text="labelFor('mqtt', 'Enable MQTT')"></span>
					</label>
					<label><span x-text="labelFor('mqttServer', 'Server')"></span>
						<input type="text" x-model="cfg.mqttServer">
					</label>
					<label><span x-text="labelFor('mqttPort', 'Port')"></span>
						<input type="number" x-model.number="cfg.mqttPort" :min="minFor('mqttPort')" :max="maxFor('mqttPort')">
					</label>
					<label><span x-text="labelFor('mqttUsername', 'Username')"></span>
						<input type="text" x-model="cfg.mqttUsername">
					</label>
					<label><span x-text="labelFor('mqttPassword', 'Password')"></span>
						<input type="password" x-model="cfg.mqttPassword" placeholder="(leave blank to keep unchanged)">
					</label>
					<label><span x-text="labelFor('mqttRootTopic', 'Root Topic')"></span>
						<input type="text" x-model="cfg.mqttRootTopic">
					</label>
					<label class="checkbox-label">
						<input type="checkbox" x-model="cfg.mqttHADiscovery"> <span x-text="labelFor('mqttHADiscovery', 'HA MQTT Discovery')"></span>
					</label>
					<label><span x-text="labelFor('mqttHADiscoveryTopic', 'HA Discovery Topic')"></span>
						<input type="text" x-model="cfg.mqttHADiscoveryTopic">
					</label>
				</fieldset>

				<fieldset>
					<legend>Operation</legend>
					<label><span x-text="labelFor('speedSetPoint', 'Speed Set Point') + (unitsFor('speedSetPoint') ? ' (' + unitsFor('speedSetPoint') + ')' : '')"></span>
						<input type="range" :min="minFor('speedSetPoint')" :max="maxFor('speedSetPoint')" x-model.number="cfg.speedSetPoint">
						<span x-text="cfg.speedSetPoint"></span>
					</label>
					<label><span x-text="labelFor('temperatureSetPoint', 'Temperature Set Point') + (unitsFor('temperatureSetPoint') ? ' (' + unitsFor('temperatureSetPoint') + ')' : '')"></span>
						<input type="range" :min="minFor('temperatureSetPoint')" :max="maxFor('temperatureSetPoint')" step="0.5" x-model.number="cfg.temperatureSetPoint">
						<span x-text="cfg.temperatureSetPoint + (unitsFor('temperatureSetPoint') ? ' ' + unitsFor('temperatureSetPoint') : '')"></span>
					</label>
					<label><span x-text="labelFor('outTemperatureCalibrationOffset', 'Outgoing Temperature Offset') + (unitsFor('outTemperatureCalibrationOffset') ? ' (' + unitsFor('outTemperatureCalibrationOffset') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.outTemperatureCalibrationOffset" :min="minFor('outTemperatureCalibrationOffset')" :max="maxFor('outTemperatureCalibrationOffset')" step="any">
					</label>
					<label><span x-text="labelFor('returnTemperatureCalibrationOffset', 'Return Temperature Offset') + (unitsFor('returnTemperatureCalibrationOffset') ? ' (' + unitsFor('returnTemperatureCalibrationOffset') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.returnTemperatureCalibrationOffset" :min="minFor('returnTemperatureCalibrationOffset')" :max="maxFor('returnTemperatureCalibrationOffset')" step="any">
					</label>
					<label><span x-text="labelFor('coolingTemperatureCalibrationOffset', 'Cooling Temperature Offset') + (unitsFor('coolingTemperatureCalibrationOffset') ? ' (' + unitsFor('coolingTemperatureCalibrationOffset') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.coolingTemperatureCalibrationOffset" :min="minFor('coolingTemperatureCalibrationOffset')" :max="maxFor('coolingTemperatureCalibrationOffset')" step="any">
					</label>
					<label><span x-text="labelFor('systemTime', 'System Response Time') + (unitsFor('systemTime') ? ' (' + unitsFor('systemTime') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.systemTime" :min="minFor('systemTime')" :max="maxFor('systemTime')">
					</label>
					<label><span x-text="labelFor('minFlowPulsesPerSec', 'Min Flow Pulses/s') + (unitsFor('minFlowPulsesPerSec') ? ' (' + unitsFor('minFlowPulsesPerSec') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.minFlowPulsesPerSec" :min="minFor('minFlowPulsesPerSec')" :max="maxFor('minFlowPulsesPerSec')">
					</label>
					<label><span x-text="labelFor('maxCurrent', 'Max Current') + (unitsFor('maxCurrent') ? ' (' + unitsFor('maxCurrent') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.maxCurrent" :min="minFor('maxCurrent')" :max="maxFor('maxCurrent')">
					</label>
					<label><span x-text="labelFor('minVoltage', 'Min Voltage') + (unitsFor('minVoltage') ? ' (' + unitsFor('minVoltage') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.minVoltage" :min="minFor('minVoltage')" :max="maxFor('minVoltage')">
					</label>
				</fieldset>

				<fieldset>
					<legend>Calibration</legend>
					<label><span x-text="labelFor('calibrationVolume', 'Calibration Volume') + (unitsFor('calibrationVolume') ? ' (' + unitsFor('calibrationVolume') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.calibrationVolume" :min="minFor('calibrationVolume')" :max="maxFor('calibrationVolume')">
					</label>
					<label><span x-text="labelFor('calibrationFlow', 'Flow at Calibration End') + (unitsFor('calibrationFlow') ? ' (' + unitsFor('calibrationFlow') + ')' : '')"></span>
						<input type="number" x-model.number="cfg.calibrationFlow" :min="minFor('calibrationFlow')" :max="maxFor('calibrationFlow')" step="any">
					</label>
					<label><span x-text="labelFor('calibrationFlowPulses', 'Flow Pulses During Calibration')"></span>
						<input type="number" x-model.number="cfg.calibrationFlowPulses" :min="minFor('calibrationFlowPulses')" :max="maxFor('calibrationFlowPulses')">
					</label>
				</fieldset>

				<div class="form-actions">
					<button type="submit" class="btn btn-primary">💾 Save</button>
				</div>
			</form>

			<template x-if="notification">
				<div class="notification" :class="notificationClass" x-text="notification"></div>
			</template>
		</section>
	</main>

	<script src="/alpine.min.js" defer></script>
	<script src="/config.js"></script>
</body>
</html>
